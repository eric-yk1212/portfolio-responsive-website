<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业官网模板 - 专业Web开发服务</title>
    <meta name="description" content="专业的企业官网开发服务，响应式设计，SEO优化">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="#home">企业品牌</a>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="#home" class="nav-link">首页</a>
                <a href="#services" class="nav-link">服务</a>
                <a href="#portfolio" class="nav-link">案例</a>
                <a href="#about" class="nav-link">关于</a>
                <a href="#contact" class="nav-link">联系</a>
            </div>
            <div class="nav-toggle" id="nav-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- 首页Hero区域 -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>专业的企业网站开发</h1>
            <p>打造现代化、响应式的企业官网，提升品牌形象和在线业务</p>
            <div class="hero-buttons">
                <a href="#contact" class="btn btn-primary">立即咨询</a>
                <a href="#portfolio" class="btn btn-secondary">查看案例</a>
            </div>
        </div>
        <div class="hero-image">
            <img src="images/hero-image.svg" alt="企业网站开发" onerror="this.style.display='none'">
        </div>
    </section>

    <!-- 服务区域 -->
    <section id="services" class="services">
        <div class="container">
            <h2>我们的服务</h2>
            <div class="services-grid">
                <div class="service-card">
                    <i class="fas fa-laptop-code"></i>
                    <h3>企业官网开发</h3>
                    <p>响应式设计，SEO优化，快速加载</p>
                </div>
                <div class="service-card">
                    <i class="fas fa-mobile-alt"></i>
                    <h3>微信小程序</h3>
                    <p>原生开发，用户体验优化</p>
                </div>
                <div class="service-card">
                    <i class="fas fa-shopping-cart"></i>
                    <h3>电商平台</h3>
                    <p>完整的电商解决方案</p>
                </div>
                <div class="service-card">
                    <i class="fas fa-tools"></i>
                    <h3>技术支持</h3>
                    <p>网站维护，功能更新</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 案例展示 -->
    <section id="portfolio" class="portfolio">
        <div class="container">
            <h2>成功案例</h2>
            <div class="portfolio-grid">
                <div class="portfolio-item">
                    <div class="portfolio-image">项目1</div>
                    <h3>科技公司官网</h3>
                    <p>现代化设计，高性能优化</p>
                </div>
                <div class="portfolio-item">
                    <div class="portfolio-image">项目2</div>
                    <h3>电商小程序</h3>
                    <p>用户体验优化，快速加载</p>
                </div>
                <div class="portfolio-item">
                    <div class="portfolio-image">项目3</div>
                    <h3>SaaS平台</h3>
                    <p>企业级架构，可扩展性</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 联系表单 -->
    <section id="contact" class="contact">
        <div class="container">
            <h2>联系我们</h2>
            <form class="contact-form" id="contact-form">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="您的姓名" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="电子邮箱" required>
                </div>
                <div class="form-group">
                    <textarea id="message" name="message" placeholder="项目需求描述" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">发送咨询</button>
            </form>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 专业Web开发服务. 保留所有权利.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
